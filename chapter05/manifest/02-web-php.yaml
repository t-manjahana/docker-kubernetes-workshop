apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-php
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-php
  template:
    metadata:
      labels:
        app: web-php
    spec:
      initContainers:
      - name: init-permissions
        image: busybox:latest
        command: ["sh", "-c", "mkdir -p /var/www/html && chmod -R 777 /var/www/html"]
        volumeMounts:
        - name: app-volume
          mountPath: /var/www/html
      containers:
      # 1. Nginx コンテナ
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config-volume
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
        - name: app-volume
          mountPath: /var/www/html

      # 2. PHP-FPM コンテナ
      - name: php
        image: php:8.2-fpm
        volumeMounts:
        - name: app-volume
          mountPath: /var/www/html

      # 3. FTP コンテナ (サイドカーとして追加)
      - name: ftp
        image: delfer/alpine-ftp-server
        env:
        - name: USERS
          value: "ftpuser|Mj19770126|/var/www/html"
        - name: ADDRESS
          value: "127.0.0.1"
        - name: MIN_PORT
          value: "31000"
        - name: MAX_PORT
          value: "31000"
        - name: PASV_MIN_PORT
          value: "31000"
        - name: PASV_MAX_PORT
          value: "31000"
        ports:
        - containerPort: 21
        - containerPort: 31000
        volumeMounts:
        - name: app-volume
          mountPath: /var/www/html

      volumes:
      - name: config-volume
        configMap:
          name: app-config
      - name: app-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web-php-service
  namespace: dev
spec:
  type: NodePort
  ports:
  - name: http
    port: 80
    targetPort: 80
  - name: ftp
    port: 21
    targetPort: 21
    nodePort: 30021
  - name: pasv
    port: 31000
    targetPort: 31000
    nodePort: 31000
  selector:
    app: web-php

