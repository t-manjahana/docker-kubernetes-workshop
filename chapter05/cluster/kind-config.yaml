kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  # 1. HTTP 用 (Web)
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  # 2. HTTPS 用 (Web)
  - containerPort: 443
    hostPort: 443
    protocol: TCP
  extraMounts:
  # ホスト側の ./bookman を kind ノードの /var/www/html にマウント
  - hostPath: ./bookman
    containerPath: /var/www/html
