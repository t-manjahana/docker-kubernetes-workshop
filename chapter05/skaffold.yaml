apiVersion: skaffold/v4beta7
kind: Config
metadata:
  name: laravel-k8s-dev
build:
  artifacts:
    - image: manabujahana/training-sample # お使いの Docker イメージ名
      context: .
      docker:
        dockerfile: docker/Dockerfile
        buildArgs:
          APP_DIR: "{{.APP_DIR}}"    # Skaffold が Docker Image を build する際の APP_DIR を指定
      sync:
        manual:
          # 同期対象ディレクトリ配下の変更をコンテナ内の /var/www/html へ直接同期
          - src: '{{.APP_DIR}}/**/*'
            dest: /var/www/html
            strip: '{{.APP_DIR}}/'
manifests:
  kustomize:
    paths:
    - manifest/               # k8s ディレクトリ配下のマニフェストファイル群（環境に合わせて調整）
portForward:
  - resourceType: Service
    resourceName: web-php-service
    namespace: dev
    port: 80
    localPort: 8080

